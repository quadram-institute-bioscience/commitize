[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commitize"
version = "0.2.1"
description = "Generate git commit messages with an LLM (OpenRouter first-class, any OpenAI-compatible provider supported)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Andrea Telatin", email = "andrea.telatin@quadram.ac.uk" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "tomlkit>=0.12",
  "platformdirs>=4.2",
]

[project.scripts]
commitize = "commitize.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/commitize"]
